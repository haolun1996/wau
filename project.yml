# Generates Wau.xcodeproj. Run `xcodegen generate` after changing this
# file or adding/removing source files.
name: Wau
options:
  bundleIdPrefix: dev.wau
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  Core:
    path: Packages/Core
  Storage:
    path: Packages/Storage
  Sync:
    path: Packages/Sync

targets:
  Wau:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - App
    dependencies:
      - package: Core
      - package: Storage
      - package: Sync
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wau
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Wau — a calm browser, flown like a kite."
        WauGoogleClientID: $(WAU_GOOGLE_CLIENT_ID)
        # Lets Wau be chosen as the default web browser.
        CFBundleURLTypes:
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
        CFBundleDocumentTypes:
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [public.html, public.xhtml]
    settings:
      base:
        # Placeholder until a real domain is chosen; changing it later resets
        # saved preferences (window size, theme) on this Mac.
        PRODUCT_BUNDLE_IDENTIFIER: dev.wau.Wau
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc signing by default; tools/package.sh re-signs with a
        # Developer ID when one is given.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          # Required for notarization.
          ENABLE_HARDENED_RUNTIME: YES

  WauTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Wau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wau.WauTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wau.app/Contents/MacOS/Wau"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Wau:
    build:
      targets:
        Wau: all
        WauTests: [test]
    test:
      targets:
        - WauTests
